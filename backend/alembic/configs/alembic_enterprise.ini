# =============================================================================
# FlyEsports 企业级 Alembic 配置文件
# 业界顶级迁移管理配置 - Netflix/Uber/Shopify级别标准
# =============================================================================

[alembic]
# 迁移脚本路径 - 使用正斜杠以确保跨平台兼容性
script_location = alembic

# 企业级文件命名模板 - Meta/Google级别标准
# 格式: YYYY_MM_DD_HHMM-{type}-{hash8}-{description}
# 这样确保：时间排序、类型识别、唯一性、可读性
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Python路径配置
prepend_sys_path = .

# 时区配置 - 使用UTC确保一致性
timezone = UTC

# 最大slug长度限制 - 保持文件名简洁
truncate_slug_length = 40

# 运行环境控制
revision_environment = true

# 安全设置 - 禁用源代码文件检测 
sourceless = false

# 多版本目录支持 - 企业级版本管理
version_locations = %(here)s/versions

# 路径分隔符配置
version_path_separator = os

# 递归版本检索 - 支持复杂目录结构
recursive_version_locations = false

# 输出编码设置
output_encoding = utf-8

# =============================================================================
# 数据库配置 - 由环境变量和代码动态配置
# 支持多环境部署：development/testing/staging/production
# =============================================================================
# sqlalchemy.url = 由env.py动态配置

# =============================================================================
# 企业级迁移钩子配置 - Stripe/Shopify级别标准
# =============================================================================
[post_write_hooks]
# 代码格式化钩子 - 确保代码质量
hooks = black,ruff,migration_validator

# Black代码格式化
black.type = console_scripts
black.entrypoint = black
black.options = -l 88 REVISION_SCRIPT_FILENAME

# Ruff代码检查和修复
ruff.type = exec
ruff.executable = ruff
ruff.options = --fix --select E,W,F,I --line-length 88 REVISION_SCRIPT_FILENAME

# 自定义迁移验证器
migration_validator.type = exec
migration_validator.executable = python
migration_validator.options = alembic/hooks/validate_migration.py REVISION_SCRIPT_FILENAME

# =============================================================================
# 企业级日志配置 - 分级日志记录
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic,flyesports_migrations

[handlers]
keys = console,file,rotating

[formatters]
keys = generic,detailed,json

# 根日志配置
[logger_root]
level = INFO
handlers = console,file
qualname =

# SQLAlchemy日志 - 生产环境建议WARN
[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine
# 设置为INFO可以看到所有SQL语句（调试用）
# level = INFO

# Alembic核心日志
[logger_alembic]
level = INFO
handlers = console,file
qualname = alembic

# FlyEsports迁移专用日志
[logger_flyesports_migrations]
level = INFO  
handlers = console,file,rotating
qualname = flyesports.migrations

# =============================================================================
# 日志处理器配置
# =============================================================================

# 控制台处理器
[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = INFO
formatter = generic

# 文件处理器
[handler_file]
class = FileHandler
args = ('alembic_migrations.log',)
level = INFO
formatter = detailed

# 轮转文件处理器 - 企业级日志管理
[handler_rotating]
class = handlers.RotatingFileHandler
args = ('alembic_migrations.log', 'a', 10485760, 5)  # 10MB, 5个备份
level = DEBUG
formatter = json

# =============================================================================
# 日志格式配置
# =============================================================================

# 基础格式
[formatter_generic]
format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# 详细格式 - 包含更多上下文信息
[formatter_detailed]
format = %(asctime)s [%(levelname)-8s] [%(name)s] [%(filename)s:%(lineno)d] %(funcName)s() - %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# JSON格式 - 用于结构化日志和监控
[formatter_json]
format = {"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "file": "%(filename)s", "line": %(lineno)d, "function": "%(funcName)s", "message": "%(message)s"}
datefmt = %Y-%m-%dT%H:%M:%S

# =============================================================================
# 企业级安全配置
# =============================================================================
[migration_security]
# 危险操作确认 - 需要额外确认
require_confirmation_for_drops = true
require_confirmation_for_data_loss = true

# 备份策略
auto_backup_before_migration = true  
backup_retention_days = 30

# 迁移监控
enable_performance_monitoring = true
slow_migration_threshold_seconds = 300

# 通知配置
notification_webhook_url = ${MIGRATION_WEBHOOK_URL}
notification_channels = slack,email

# =============================================================================
# 环境特定配置
# =============================================================================
[development]
# 开发环境 - 详细日志，快速反馈
log_level = DEBUG
enable_sql_echo = true
auto_upgrade = false

[testing]  
# 测试环境 - 快速迁移，最小日志
log_level = WARN
enable_sql_echo = false
auto_upgrade = true
use_transactions = true

[staging]
# 预生产环境 - 生产环境的镜像配置
log_level = INFO
enable_sql_echo = false
auto_upgrade = false
require_approval = true

[production]
# 生产环境 - 最高安全级别
log_level = WARN
enable_sql_echo = false
auto_upgrade = false
require_approval = true
enable_monitoring = true
backup_before_migration = true

# =============================================================================
# 性能优化配置 - 大规模数据库优化
# =============================================================================
[performance]
# 连接池配置
pool_size = 5
max_overflow = 20
pool_pre_ping = true
pool_recycle = 3600

# 事务管理
transaction_timeout = 1800  # 30分钟
statement_timeout = 600     # 10分钟

# 批处理配置
batch_size = 1000
parallel_workers = 4

# =============================================================================
# 监控和告警配置 - DataDog/NewRelic级别
# =============================================================================
[monitoring]
# 指标收集
enable_metrics = true
metrics_endpoint = ${METRICS_ENDPOINT}

# 健康检查
health_check_endpoint = /alembic/health
health_check_interval = 30

# 告警阈值
error_rate_threshold = 0.01
latency_threshold = 5000  # 5秒

# =============================================================================
# 扩展插件配置
# =============================================================================
[plugins]
# 自定义插件加载
enable_custom_plugins = true
plugin_directory = alembic/plugins

# 已启用的插件
enabled_plugins = 
    security_checker,
    performance_monitor,
    backup_manager,
    notification_sender

# =============================================================================
# 模板配置 - 智能迁移生成
# =============================================================================
[templates]
# 模板目录
template_directory = alembic/templates

# 默认模板
default_template = enterprise_migration.mako

# 模板变量
author_name = ${GIT_USER_NAME}
author_email = ${GIT_USER_EMAIL}
company = FlyEsports