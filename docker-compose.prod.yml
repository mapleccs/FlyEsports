version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: []  # Remove port exposure in production

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports: []  # Remove port exposure in production

  backend:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://flyesports:${POSTGRES_PASSWORD}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://flyesports.com}
      - LOG_LEVEL=INFO
    ports: []  # Remove port exposure, use reverse proxy
    volumes: []  # Remove volume mounts in production

  # Celery Worker (Production)
  celery-worker:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://flyesports:${POSTGRES_PASSWORD}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - LOG_LEVEL=INFO
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-8}
    volumes: []  # Remove volume mounts in production
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Celery Beat (Production)
  celery-beat:
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://flyesports:${POSTGRES_PASSWORD}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - celery_beat_data:/app/celerybeat-schedule
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  frontend:
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL:-https://api.flyesports.com/api/v1}
      - VITE_APP_TITLE=FlyEsports
      - VITE_APP_ENV=production
    ports: []  # Remove port exposure, use reverse proxy
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Nginx Reverse Proxy for production
  nginx:
    image: nginx:alpine
    container_name: flyesports_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - flyesports_network
    depends_on:
      - backend
      - frontend