services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flyesports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flyesports
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - flyesports_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyesports"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flyesports_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flyesports_redis_dev}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - flyesports_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyesports_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-for-development-only-change-in-production}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    networks:
      - flyesports_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyesports_celery_worker
    restart: unless-stopped
    command: celery -A src.infrastructure.tasks.celery_app worker --loglevel=info --concurrency=2 -Q high_priority,medium_priority,low_priority --max-tasks-per-child=1000 --prefetch-multiplier=1
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-for-development-only-change-in-production}
      - C_FORCE_ROOT=1
    networks:
      - flyesports_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - celery_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.infrastructure.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyesports_celery_beat
    restart: unless-stopped
    command: celery -A src.infrastructure.tasks.celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/flyesports
      - REDIS_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-for-development-only-change-in-production}
      - C_FORCE_ROOT=1
    networks:
      - flyesports_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/beat_data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Celery Flower (Task Monitoring)
  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyesports_celery_flower
    restart: unless-stopped
    command: celery -A src.infrastructure.tasks.celery_app flower --port=5555 --broker=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
    environment:
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-flyesports_redis_dev}@redis:6379/1
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    ports:
      - "5555:5555"
    networks:
      - flyesports_network
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    volumes:
      - flower_data:/app/flower_db
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/api/workers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Frontend Web App (Development Mode with HMR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: flyesports_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_APP_TITLE=FlyEsports
      - VITE_APP_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    ports:
      - "3000:3000"
    networks:
      - flyesports_network
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_cache:/app/.vite
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  flyesports_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  backend_logs:
    driver: local
  celery_logs:
    driver: local
  celery_beat_data:
    driver: local
  flower_data:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_cache:
    driver: local