<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlyEsports - 电竞赛事管理平台</title>
    <meta name="description" content="专业的电竞赛事管理平台，为电竞爱好者提供赛事组织、报名、比赛管理等一站式服务" />
    <meta name="keywords" content="电竞,赛事,比赛,游戏,管理平台,英雄联盟,LOL" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flyesports.com/" />
    <meta property="og:title" content="FlyEsports - 电竞赛事管理平台" />
    <meta property="og:description" content="专业的电竞赛事管理平台，为电竞爱好者提供赛事组织、报名、比赛管理等一站式服务" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://flyesports.com/" />
    <meta property="twitter:title" content="FlyEsports - 电竞赛事管理平台" />
    <meta property="twitter:description" content="专业的电竞赛事管理平台，为电竞爱好者提供赛事组织、报名、比赛管理等一站式服务" />
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Reset and base styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        height: 100%;
        scroll-behavior: smooth;
      }
      
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #app {
        height: 100%;
        min-height: 100vh;
      }
      
      /* Loading styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-content {
        text-align: center;
        color: white;
      }
      
      .loading-logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #fff, #f0f0f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto 1rem;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 1.1rem;
        opacity: 0.9;
      }
      
      /* Hide loading when app is ready */
      .app-ready .app-loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Loading screen -->
      <div class="app-loading">
        <div class="loading-content">
          <div class="loading-logo">FlyEsports</div>
          <div class="loading-spinner"></div>
          <div class="loading-text">正在加载电竞赛事平台...</div>
        </div>
      </div>
    </div>
    
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          document.body.classList.add('app-ready');
        }, 500);
      });
      
      // Global error handler
      window.addEventListener('error', (e) => {
        console.error('Global error:', e.error);
      });
      
      // Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
