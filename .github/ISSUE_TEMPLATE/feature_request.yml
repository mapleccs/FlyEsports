name: ✨ Feature Request
description: Suggest an idea for this project
title: "[FEATURE]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a new feature! Please provide as much detail as possible to help us understand your request.

  - type: checkboxes
    id: area
    attributes:
      label: Feature Area
      description: Which area(s) would this feature affect?
      options:
        - label: User Authentication & Authorization
        - label: Player Profile Management
        - label: Team Management
        - label: Tournament/Match System
        - label: Rating & Ranking System
        - label: Riot Games API Integration
        - label: Real-time Features (WebSocket)
        - label: Admin Panel
        - label: Mobile Responsiveness
        - label: Performance & Optimization
        - label: Developer Experience
        - label: Documentation

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - High (Critical for user experience)
        - Medium (Important improvement)
        - Low (Nice to have)
      default: 1
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature might be?
      options:
        - Simple (Few hours to implement)
        - Medium (Few days to implement)
        - Complex (Weeks to implement)
        - Major (Requires significant architecture changes)
        - I'm not sure
      default: 4

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: |
        A clear and concise description of what the problem is.
        Example: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: |
        A clear and concise description of what you want to happen.
        Include any specific requirements or behavior you expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe alternatives you've considered
      placeholder: |
        A clear and concise description of any alternative solutions 
        or features you've considered.

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe this feature as a user story
      placeholder: |
        As a [type of user], I want [goal] so that [reason/benefit].
        
        Example:
        As a tournament organizer, I want to automatically generate match schedules 
        so that I can save time and reduce scheduling conflicts.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define what success looks like for this feature
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
        
        Example:
        - [ ] Users can create tournaments with custom rules
        - [ ] System automatically generates bracket structure
        - [ ] Tournament progress updates in real-time

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Any technical aspects to consider?
      placeholder: |
        - Database schema changes needed?
        - API endpoints to be created/modified?
        - Frontend components required?
        - External integrations needed?
        - Performance implications?
        - Security considerations?

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Wireframes
      description: If you have any visual ideas, please share them
      placeholder: |
        Drag and drop images here or describe the UI/UX you have in mind

  - type: textarea
    id: examples
    attributes:
      label: Examples from Other Applications
      description: Are there examples of this feature in other apps?
      placeholder: |
        Links to or descriptions of similar features in other applications
        that implement what you're suggesting

  - type: dropdown
    id: target-users
    attributes:
      label: Target Users
      description: Who would primarily benefit from this feature?
      options:
        - Players/Gamers
        - Tournament Organizers
        - Team Captains
        - Administrators
        - All Users
        - Developers
      multiple: true
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Expected Impact
      description: What kind of impact do you expect this feature to have?
      options:
        - label: Improved user experience
        - label: Increased user engagement
        - label: Better performance
        - label: Enhanced security
        - label: Simplified workflow
        - label: New functionality
        - label: Bug prevention
        - label: Developer productivity

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or information about the feature request here
      placeholder: |
        Any additional information, links, or context that would be helpful
        in understanding and implementing this feature

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I am willing to submit a pull request for this feature
        - label: I can help with testing
        - label: I can help with documentation
        - label: I can provide feedback during development
        - label: I can help with design/mockups

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all requested information above
          required: true
        - label: This feature aligns with the project's goals and scope
          required: true