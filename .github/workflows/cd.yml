name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: flyesports/backend
  IMAGE_NAME_FRONTEND: flyesports/frontend

jobs:
  # Build and push Docker images
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    
    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      frontend-image: ${{ steps.frontend-meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=latest
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Extract backend metadata
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Extract frontend metadata
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ fromJSON(steps.backend-meta.outputs.json).labels['org.opencontainers.image.created'] }}
          GIT_COMMIT=${{ github.sha }}
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          VITE_BUILD_DATE=${{ fromJSON(steps.frontend-meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VITE_GIT_COMMIT=${{ github.sha }}

  # Deploy to staging environment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.flyesports.com
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup deployment files
      run: |
        # Create deployment directory
        mkdir -p deploy/staging
        
        # Copy deployment files
        cp docker-compose.yml deploy/staging/
        cp docker-compose.prod.yml deploy/staging/
        
        # Create environment file for staging
        cat > deploy/staging/.env << EOF
        # Staging Environment Configuration
        ENVIRONMENT=staging
        DEBUG=false
        
        # Database
        POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
        DATABASE_URL=postgresql+asyncpg://postgres:${{ secrets.STAGING_POSTGRES_PASSWORD }}@postgres:5432/flyesports
        
        # Redis
        REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
        REDIS_URL=redis://:${{ secrets.STAGING_REDIS_PASSWORD }}@redis:6379/0
        
        # JWT
        JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}
        
        # Celery
        CELERY_BROKER_URL=redis://:${{ secrets.STAGING_REDIS_PASSWORD }}@redis:6379/1
        CELERY_RESULT_BACKEND=redis://:${{ secrets.STAGING_REDIS_PASSWORD }}@redis:6379/1
        
        # API Keys
        RIOT_API_KEY=${{ secrets.STAGING_RIOT_API_KEY }}
        
        # Images
        BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}
        FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend-image }}
        EOF
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        echo "Backend image: ${{ needs.build-and-push.outputs.backend-image }}"
        echo "Frontend image: ${{ needs.build-and-push.outputs.frontend-image }}"
        
        # Here you would typically:
        # 1. Copy files to staging server
        # 2. Run docker-compose with new images
        # 3. Run database migrations
        # 4. Perform health checks
        
        # For now, we'll simulate the deployment
        echo "Deployment configuration prepared successfully"
    
    - name: Run staging tests
      run: |
        echo "Running staging environment tests..."
        # Add staging-specific tests here
        echo "Staging tests passed"

  # Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://flyesports.com
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup production deployment files
      run: |
        # Create deployment directory
        mkdir -p deploy/production
        
        # Copy deployment files
        cp docker-compose.prod.yml deploy/production/
        
        # Create environment file for production
        cat > deploy/production/.env << EOF
        # Production Environment Configuration
        ENVIRONMENT=production
        DEBUG=false
        
        # Database
        POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
        DATABASE_URL=postgresql+asyncpg://postgres:${{ secrets.PROD_POSTGRES_PASSWORD }}@postgres:5432/flyesports
        
        # Redis
        REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
        REDIS_URL=redis://:${{ secrets.PROD_REDIS_PASSWORD }}@redis:6379/0
        
        # JWT
        JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET }}
        
        # Celery
        CELERY_BROKER_URL=redis://:${{ secrets.PROD_REDIS_PASSWORD }}@redis:6379/1
        CELERY_RESULT_BACKEND=redis://:${{ secrets.PROD_REDIS_PASSWORD }}@redis:6379/1
        
        # API Keys
        RIOT_API_KEY=${{ secrets.PROD_RIOT_API_KEY }}
        
        # Images
        BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}
        FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend-image }}
        
        # Production specific
        LOG_LEVEL=INFO
        ALLOWED_ORIGINS=https://flyesports.com,https://www.flyesports.com
        EOF
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        echo "Version: ${{ needs.build-and-push.outputs.version }}"
        echo "Backend image: ${{ needs.build-and-push.outputs.backend-image }}"
        echo "Frontend image: ${{ needs.build-and-push.outputs.frontend-image }}"
        
        # Here you would typically:
        # 1. Create backup of current production
        # 2. Copy files to production servers
        # 3. Run blue-green deployment
        # 4. Run database migrations
        # 5. Perform comprehensive health checks
        # 6. Switch traffic to new version
        
        # For now, we'll simulate the deployment
        echo "Production deployment configuration prepared successfully"
    
    - name: Run production health checks
      run: |
        echo "Running production health checks..."
        # Add comprehensive production health checks here
        echo "Production health checks passed"
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this release
          
          ### Backend Changes
          - Backend image: ${{ needs.build-and-push.outputs.backend-image }}
          
          ### Frontend Changes  
          - Frontend image: ${{ needs.build-and-push.outputs.frontend-image }}
          
          ### Deployment Information
          - Version: ${{ needs.build-and-push.outputs.version }}
          - Git Commit: ${{ github.sha }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
          
          For detailed changes, see the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref }})
        draft: false
        prerelease: false

  # Rollback workflow (manual trigger)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    
    steps:
    - name: Rollback production deployment
      run: |
        echo "Rolling back production deployment..."
        echo "Previous version: ${{ github.event.inputs.previous_version }}"
        
        # Here you would typically:
        # 1. Switch traffic back to previous version
        # 2. Rollback database migrations if needed
        # 3. Verify rollback success
        
        echo "Rollback completed successfully"