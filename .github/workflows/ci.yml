name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # Backend code quality checks
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install -r requirements.txt
    
    - name: Run Black formatting check
      run: black --check --diff src/ tests/
    
    - name: Run Flake8 linting
      run: flake8 src/ tests/
    
    - name: Run MyPy type checking
      run: mypy src/
    
    - name: Check imports with isort
      run: isort --check-only --diff src/ tests/

  # Backend tests
  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flyesports_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flyesports_test
        REDIS_URL: redis://localhost:6379/0
        CELERY_BROKER_URL: redis://localhost:6379/1
        CELERY_RESULT_BACKEND: redis://localhost:6379/1
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
        ENVIRONMENT: test
      run: |
        pytest --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80 -v
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: codecov-backend

  # Frontend code quality and tests
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Run TypeScript type checking
      run: npm run type-check
    
    - name: Run Prettier format check
      run: npx prettier --check src/
    
    - name: Build application
      run: npm run build
      env:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_APP_TITLE: FlyEsports
        VITE_APP_ENV: production

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # Python security scan
    - name: Set up Python for security scan
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run Safety check (Python dependencies)
      run: safety check -r backend/requirements.txt --json --output security-report.json || true
    
    - name: Run Bandit security scan (Python code)
      run: bandit -r backend/src/ -f json -o bandit-report.json || true
    
    # Node.js security scan
    - name: Set up Node.js for security scan
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run npm audit
      working-directory: ./frontend
      run: npm audit --audit-level high --json > npm-audit.json || true

  # Docker build test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: flyesports/backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: flyesports/frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration test with docker-compose
  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create test environment file
      run: |
        echo "POSTGRES_PASSWORD=test_password" >> .env
        echo "REDIS_PASSWORD=test_redis_password" >> .env
        echo "JWT_SECRET_KEY=test-jwt-secret-key-for-integration-tests-only" >> .env
    
    - name: Start services
      run: docker-compose up -d postgres redis
    
    - name: Wait for services
      run: |
        timeout 60s bash -c 'until docker-compose exec -T postgres pg_isready -U postgres; do sleep 2; done'
        timeout 60s bash -c 'until docker-compose exec -T redis redis-cli ping | grep PONG; do sleep 2; done'
    
    - name: Run database migrations
      run: |
        docker-compose run --rm backend alembic upgrade head
    
    - name: Run integration tests
      run: |
        docker-compose up -d backend
        sleep 10
        # Health check
        curl -f http://localhost:8000/health || exit 1
        # Detailed health check
        curl -f http://localhost:8000/health/detailed || exit 1
    
    - name: Check Celery services
      run: |
        docker-compose up -d celery-worker celery-beat
        sleep 15
        # Test Celery worker health
        docker-compose exec -T celery-worker celery -A src.infrastructure.tasks.celery_app inspect ping || exit 1
    
    - name: Cleanup
      if: always()
      run: docker-compose down -v

  # Deployment readiness check
  deployment-check:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate docker-compose files
      run: |
        docker-compose -f docker-compose.yml config
        docker-compose -f docker-compose.prod.yml config
    
    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified